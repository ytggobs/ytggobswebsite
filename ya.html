<body>
    <header>
        <ul>
        <li><a href="index.html">Home</a></li>

        <li><a href="ya.html">Romanized YÀ to Yoshiàdo</a></li>

    <div class="content">
    <ul>
    <li><p>un = </p><p>Untranslable</p>
    <img src="ys/un.png" width="64"></li>
    <li><p>qm = </p><p>Question Mark</p>
    <img src="ys/qm.png" width="64"></li>
    <li><p>- = </p><p>Short Pause</p>
    <img src="ys/-.png" width="64"></li>
    </ul>
    <img class="alphabet" width="25%" src="./ys/alphabet.png">
    <textarea placeholder="yoshiàdo" id="text"></textarea>
    <br>
    <p>Yoshiàdo:</p>
    <div id="result" class="result">
    </div>
    </div>
     <script>
        const TOKENS = [ "!", "'", "a", "ahh", "ap", "bal1", "bal2", "bal3", "bal4", "-", "bu", "da", "dae", "de", "do", ".", "dæ", "e", "em", "f", "fa", "gya", "gyu", "h", "ha", "hom", "i", "j", "k", "ka", "ke", "l", "m", "n", "o", "ohh", "oup", "pu", "qm", "r", "s", "shi", " ", "t", "un", "yci", "yoshi", "z", "zh", "à", "æ", "cc", "è", "ô", "co", "ca", "ce"];
        const TOKENS_SORTED = TOKENS.slice().sort((a, b) => b.length - a.length);
        document.addEventListener('DOMContentLoaded', () => {
              const textarea = document.getElementById('text');
              textarea.addEventListener('input', convert, { passive: true });
              convert();
        });
        function convert() {
        const container = document.getElementById('result');
        container.innerHTML = '';
        const str = document.getElementById("text").value.trim();
        if (!str) return;

        let i = 0
        while (i < str.length) {
            let matched = null;
            for (const token of TOKENS_SORTED) {
                const substr = str.substring(i, i + token.length);
                if (substr.toLowerCase() === token.toLowerCase()) {
                    matched = token;
                    break;
                  }
                }
          if (matched) {
            const img = document.createElement('img');
            img.src = "ys/" + encodeURIComponent(matched) + ".png";
            img.width = 64;
            img.alt = matched;
            const result = img.src;
            container.appendChild(img);
            i += matched.length;
          } else {
              const h2 = document.createElement("h3");
              h2.className = 'MISSINGNO';
              h2.textContent = str[i];
              container.appendChild(h2);
              i += 1;
            }
        }
    }
    </script>
    <div class="download"><a href="https://github.com/ytggobs/ytggobswebsite/raw/refs/heads/master/yb/ya3.0.ttf">Font available to download</a> <a href="https://benpa.ng/bited/">(maded with bited)</a></div>
</body>
