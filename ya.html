    <script>
        const TOKENS = [ "!", "'", "a", "ae", "ahh", "ap", "bal1", "bal2", "bal3", "bal4", "bbl", "bu", "da", "dae", "de", "do", "dot", "dæ", "e", "em", "f", "fa", "gya", "gyu", "h", "ha", "hom", "i", "j", "k", "ka", "ke", "l", "m", "n", "o", "ohh", "oup", "pu", "qm", "r", "s", "shi", "sp", "t", "un", "yee", "yoshi", "z", "zh", "à", "æ", "è", "ô", "ā", "ē"];
        const TOKENS_SORTED = TOKENS.slice().sort((a, b) => b.length - a.length);
        function convert() {
        const container = document.getElementById('result');
        container.innerHTML = '';
        const syr = document.getElementById("text").value.trim;
        if (!str) return;

        let i = 0
        while (i < str.length) {
            let matched = null;
            for (const token of TOKENS_SORTED) {
                const substr = str.substring(i, i + token.length);
                if (substr.toLowerCase() === token.toLowerCase()) {
                    matched = token;
                    break;
                  }
                }
          if (matched) {
            const img = document.createElement('img');
            img.src = "ys/" + encodeURIComponent(matched) + ".png";
            img.width = 50
            img.alt = matched;
            const result = img.src
            container.appendChild(img);
            i += matched.length;
          } else {
              const h2 = document.createElement("h2");
              h2.className = 'unknown'
              h2.textContent = str[i]
              container.appendChild(h2);
              i += 1;
            }
    }
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('text');
      textarea.addEventListener('input', convert, { passive: true });
      convert();
    });
    </script>
